# YOLO12-SNN 模型配置文件（集成脉冲神经元）

# Parameters
nc: 80  # 类别数
scales:
  n: [0.50, 0.25, 1024]  # 使用 YOLOv12n 的缩放系数

# YOLO12-SNN backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SNNConvBlock, [64, 3, 2]]   # 0-P1/2: 输入通道3，输出64，kernel=3，stride=2，beta=0.5，threshold=1.0
  - [-1, 1, SNNConvBlock, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2_SNN, [256, 256]]    # 2-P3/8: c1=256, c2=256, shortcut=False, g=0.25
  - [-1, 1, SNNConvBlock, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2_SNN, [512, 512]]    # 4-P4/16: c1=512, c2=512, shortcut=False, g=0.25
  - [-1, 1, SNNConvBlock, [512, 3, 2]]  # 5-P4/16
  - [-1, 4, A2C2f_SNN, [512, 512]]       # 6-P5/32: c1=512, c2=512, shortcut=True, g=1
  - [-1, 1, SNNConvBlock, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f_SNN, [1024, 1024]]     # 8-P5/32: c1=1024, c2=1024, shortcut=True, g=1

# YOLO12n head（Detect 层保持不变）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, A2C2f_SNN, [512, 512]]      # 11: c1=512, c2=512, shortcut=False, g=1
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, A2C2f_SNN, [256, 256]]      # 14: c1=256, c2=256, shortcut=False, g=1
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, A2C2f_SNN, [512, 512]]      # 17: c1=512, c2=512, shortcut=False, g=1
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2_SNN, [1024, 1024]]      # 20: c1=1024, c2=1024, shortcut=True, g=1
  - [[14, 17, 20], 1, Detect, [nc]]