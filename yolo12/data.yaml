# DIOR
# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: HAE-DIOR  # dataset root dir
train: images/train  # train images (relative to 'path') 118287 images
val:  images/val  # train images (relative to 'path') 5000 images
test: images/test  # 20288 of 40670 images, submit to https://competitions.codalab.org/competitions/20794
# Classes
nc: 20  # 类别数量
names:  [
  "harbor",           # 港口
  "ship",              # 船舶
  "storagetank",       # 储罐
  "chimney",          # 烟囱
  "dam",               # 水坝
  "trainstation",       # 火车站
  "basketballcourt" ,   # 篮球场
  "airport" ,          # 机场
  "expressway-service-area",  # 高速公路服务区
  "airplane" ,         # 飞机
  "baseballfield" ,    # 棒球场
  "expressway-toll-station", # 高速公路收费站
  "vehicle" ,         # 车辆
  "golffield"  ,      # 高尔夫球场
  "bridge"  ,         # 桥梁
  "groundtrackfield" , # 地面跑道场
  "overpass" ,        # 立交桥
  "windmill" ,        # 风车
  "tenniscourt" ,     # 网球场
  "stadium"          # 体育场
]

